<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matthew’s Sandbox 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<script src="three.min.js"></script>
<script src="cannon.min.js"></script>
<style>
:root{
  --panel:#fff7e6; --ink:#2a2233; --sel:#ffd23f; --hot:#ff6b4a; --muted:#6b5f73; --chip:#ffeccc;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:#2a2233; --ink:#fff4dc; --sel:#d9a91f; --hot:#e8573a; --muted:#c9bcd4; --chip:#3a3046; }
}
:root[data-theme="dark"]{ --panel:#2a2233; --ink:#fff4dc; --sel:#d9a91f; --hot:#e8573a; --muted:#c9bcd4; --chip:#3a3046; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--panel);color:var(--ink);font-family:"Pixelify Sans",ui-monospace,"Courier New",monospace;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{display:flex;flex-direction:column;height:100%}
#stage{position:relative;flex:1;min-height:0;background:#cfe8e4}
#c{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#title{position:absolute;top:8px;left:10px;font-size:26px;font-weight:700;color:#2a2233;text-shadow:3px 3px 0 #fff;pointer-events:none;line-height:1}
#top{position:absolute;top:8px;right:8px;display:flex;gap:6px}
.pb{font:inherit;font-weight:700;font-size:16px;background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:4px 4px 0 rgba(0,0,0,.25);padding:4px 10px;cursor:pointer;line-height:1.1}
.pb:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
.pb.on{background:var(--sel)}
.pb:focus-visible,.slot:focus-visible{outline:3px dashed var(--hot);outline-offset:2px}
#toast{position:absolute;left:50%;top:52px;transform:translateX(-50%);font-size:20px;font-weight:700;color:#2a2233;text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff;pointer-events:none;white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#dock{border-top:4px solid var(--ink);background:var(--panel);padding:6px 8px 8px}
#tabs{display:flex;gap:6px;margin-bottom:6px;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
#tabs .pb{flex:0 0 auto}
#tabs .pb{font-size:15px;padding:2px 12px;box-shadow:none}
#slots{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#slots::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:78px;height:78px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:inherit;font-weight:700;font-size:13px;color:var(--ink);background:var(--chip);border:4px solid var(--ink);cursor:pointer;padding:0}
.slot img{width:40px;height:40px;image-rendering:pixelated;object-fit:contain}
.slot.on{background:var(--hot);color:#fff}
.sheet{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,30,.55);padding:10px;z-index:5}
.sheet.show{display:flex}
.card{background:var(--panel);color:var(--ink);border:4px solid var(--ink);box-shadow:8px 8px 0 rgba(0,0,0,.3);width:min(720px,100%);max-height:100%;overflow:auto;padding:12px 14px}
.card h2{margin:0 0 8px;font-size:24px}
.mk{display:flex;gap:16px;align-items:flex-start}
#mkPrev{width:130px;height:252px;image-rendering:pixelated;flex:0 0 auto;background:#cfe8e4;border:4px solid var(--ink)}
#mkRows{flex:1;min-width:0}
.row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.row label{flex:0 0 118px;font-size:15px;color:var(--muted);font-weight:700}
.row .val{flex:0 0 110px;height:30px;border:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700}
.row .pb{padding:0 10px;height:30px;box-shadow:none}
#mkName{font:inherit;font-size:17px;font-weight:700;border:4px solid var(--ink);background:var(--chip);color:var(--ink);padding:2px 8px;width:100%}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:8px}
.stages{display:flex;gap:8px;flex-wrap:wrap}
.stages button{width:118px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px}
.stages img{width:96px;height:60px;image-rendering:pixelated;border:3px solid var(--ink)}
#mission{position:absolute;top:44px;left:10px;max-width:calc(100% - 20px);font:inherit;font-weight:700;font-size:15px;background:var(--sel);color:#2a2233;border:4px solid #2a2233;box-shadow:4px 4px 0 rgba(0,0,0,.25);padding:3px 10px;cursor:pointer;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission[hidden]{display:none}
.pan{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;font:inherit;font-weight:700;font-size:26px;background:rgba(255,247,230,.75);color:#2a2233;border:4px solid #2a2233;cursor:pointer;touch-action:none;padding:0}
#panL{left:6px}#panR{right:6px}
.pan[hidden]{display:none}
#bHide{margin-left:auto}
#pad{position:absolute;inset:auto 0 0 0;pointer-events:none;z-index:4}
#pad[hidden]{display:none}
#pad .pg{position:absolute;bottom:12px;display:flex;gap:10px;pointer-events:auto}
#pad .pl{left:12px}#pad .pr{right:12px}
#pad button{width:66px;height:66px;font:inherit;font-weight:700;font-size:20px;background:rgba(255,247,230,.85);color:#2a2233;border:4px solid #2a2233;box-shadow:4px 4px 0 rgba(0,0,0,.25);touch-action:none;user-select:none;-webkit-user-select:none;padding:0;cursor:pointer}
#pad button.down{background:#ffd23f;transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.25)}
#pad .act{background:#ff6b4a;color:#fff}
#padExit{position:absolute;right:12px;bottom:92px;width:auto!important;height:40px!important;padding:0 12px!important;font-size:15px!important;pointer-events:auto}
body.ctrl #zoomBox{bottom:92px}
body.ctrl #dock{display:none}
#hud{position:absolute;top:44px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3}
#hud[hidden]{display:none}
#hud .hc{background:rgba(42,34,51,.8);color:#fff;font-weight:700;font-size:15px;padding:3px 10px;border:3px solid #2a2233}
#hud .bar{width:140px;height:12px;background:#0006;display:inline-block;vertical-align:middle;margin-left:6px}
#hud .bar i{display:block;height:100%;background:#4ade80}
#pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-size:34px;font-weight:700;color:#ffd23f;text-shadow:3px 3px 0 #2a2233,-3px -3px 0 #2a2233,3px -3px 0 #2a2233,-3px 3px 0 #2a2233;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap}
#pop.show{opacity:1;transform:translate(-50%,-60%)}
@media (max-height:520px){ #pad button{width:54px;height:54px;font-size:17px} #padExit{bottom:76px} body.ctrl #zoomBox{bottom:76px} }
#zoomBox{position:absolute;left:8px;bottom:8px;display:flex;align-items:center;gap:6px;font-weight:700;color:#2a2233;text-shadow:2px 2px 0 #fff}
#zoomBox .pb{width:40px;height:36px;padding:0;font-size:22px}
#dock.mini #slots{display:none}
.mlist{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.mrow{display:flex;align-items:center;gap:10px;text-align:left;width:100%;padding:6px 10px}
.mrow .st{font-size:20px;flex:0 0 26px;text-align:center}
.mrow.done{opacity:.6}
.mrow.now{background:var(--sel)}
.sfrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
#sfCrop{width:240px;height:240px;background:#1d1a33;border:4px solid var(--ink);touch-action:none;cursor:grab}
#sfFace{width:96px;height:96px;image-rendering:pixelated;border:4px solid var(--ink);background:#cfe8e4}
#sfFull{width:64px;height:136px;image-rendering:pixelated;border:4px solid var(--ink);background:#cfe8e4;margin-left:8px}
.srow{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:2px dashed var(--chip);flex-wrap:wrap}
.srow .nm{flex:1 1 140px;font-weight:700}
.srow .nm small{display:block;color:var(--muted);font-size:12px}
.srow .pb{padding:2px 8px;box-shadow:none}
.srow .rec{background:#ff4d5e;color:#fff}
.srow .rec.live{animation:blink .5s infinite}
@keyframes blink{50%{opacity:.5}}
.zoom{display:flex;align-items:center;gap:10px;margin-top:8px;font-weight:700}
.zoom input{flex:1;accent-color:var(--hot)}
@media (max-height:520px){ .slot{width:62px;height:62px;font-size:11px} .slot img{width:30px;height:30px} #title{font-size:20px} .pb{font-size:14px} }
@media (max-width:560px){ #top{left:6px;right:6px;flex-wrap:wrap;justify-content:flex-end;gap:4px} #top .pb{font-size:12px;padding:3px 6px;border-width:3px;box-shadow:2px 2px 0 rgba(0,0,0,.25)} #title{font-size:16px;top:42px} #toast{top:64px;font-size:16px} #mission{top:72px;font-size:13px} }
@media (max-width:520px){ .mk{flex-direction:column;align-items:center} #mkPrev{width:104px;height:202px} .row label{flex-basis:96px} .row .val{flex-basis:90px} }
@media (prefers-reduced-motion: reduce){ #toast{transition:none} .pb:active{transform:none} }
#bubbles{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.bub.mon{background:#4b2a8f;color:#fff;border-color:#2a1550;font-size:17px}
#growBar{display:flex;align-items:center;gap:6px;margin:0 0 6px;font-weight:700}
#growBar[hidden]{display:none}
#growBar .pb{padding:2px 10px;box-shadow:none}
#hud3{position:absolute;top:46px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;pointer-events:none;z-index:3;flex-wrap:wrap;justify-content:center;width:max-content;max-width:94%}
#hud3[hidden]{display:none}
#hud3 .hc{background:rgba(42,34,51,.82);color:#fff;font-weight:700;font-size:15px;padding:3px 10px;border:3px solid #2a2233}
#hud3 .hc.red{background:#c0392b}
#hud3 .bar{width:110px;height:12px;background:#0006;display:inline-block;vertical-align:middle;margin-left:6px}
#hud3 .bar i{display:block;height:100%}
#mini{position:absolute;right:10px;top:50px;width:130px;height:130px;border:3px solid #2a2233;image-rendering:pixelated;z-index:3}
#mini[hidden]{display:none}
#pop3{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%);font-size:32px;font-weight:700;color:#ffd23f;text-shadow:3px 3px 0 #2a2233,-3px -3px 0 #2a2233,3px -3px 0 #2a2233,-3px 3px 0 #2a2233;pointer-events:none;opacity:0;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:5}
#pop3.show{opacity:1;transform:translate(-50%,-60%)}
#pad3{position:absolute;inset:0;pointer-events:none;z-index:4}
#pad3[hidden]{display:none}
#joy{position:absolute;left:18px;bottom:18px;width:130px;height:130px;border-radius:50%;background:rgba(255,247,230,.35);border:4px solid rgba(42,34,51,.6);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:#ffd23f;border:4px solid #2a2233;transform:translate(-50%,-50%)}
#pbtns{position:absolute;right:14px;bottom:16px;display:flex;gap:10px;align-items:flex-end;pointer-events:auto}
#pbtns .pb{width:70px;height:70px;padding:0;font-size:17px;touch-action:none}
#pbtns .pb[hidden]{display:none}
#pbtns .pb.act{background:#ff6b4a;color:#fff}
#pbtns .pb.down{background:#ffd23f;color:#2a2233}
#pExit{position:absolute;right:14px;bottom:98px;pointer-events:auto}
body.ctrl #dock{display:none}
body.ctrl #camBox{display:none}
body.ctrl #title{display:none}
@media (max-height:520px){ #joy{width:110px;height:110px} #pbtns .pb{width:58px;height:58px;font-size:15px} #pExit{bottom:84px} }
.bub{position:absolute;left:0;top:0;background:#fff;color:#2a2233;border:3px solid #2a2233;font-weight:700;font-size:15px;padding:2px 8px;white-space:nowrap;box-shadow:3px 3px 0 rgba(0,0,0,.2)}
#camBox{position:absolute;left:8px;bottom:8px;display:grid;grid-template-columns:repeat(3,44px);gap:5px}
#camBox .pb{width:44px;height:40px;padding:0;font-size:19px;touch-action:none}
#bReset{font-size:13px!important}
#dock.mini #slots{display:none}
#bHide{margin-left:auto}
@media (max-width:560px){ #top{left:6px;right:6px;flex-wrap:wrap;justify-content:flex-end;gap:4px} #top .pb{font-size:12px;padding:3px 6px;border-width:3px} #title{font-size:16px;top:42px} #camBox{grid-template-columns:repeat(3,38px)} #camBox .pb{width:38px;height:34px} }

</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c" aria-label="Matthew's Sandbox 3D world"></canvas>
    <div id="bubbles"></div>
    <div id="title">Matthew’s Sandbox 3D</div>
    <div id="top"><button class="pb" id="bGames">Games</button><button class="pb" id="bStage">Stage</button><button class="pb" id="bSound">Sound: on</button><button class="pb" id="bClear">Clear</button></div>
    <div id="toast"></div>
    <div id="camBox">
      <button class="pb" data-cam="l" aria-label="Turn left">&#8634;</button><button class="pb" data-cam="up" aria-label="Look down from higher">^</button><button class="pb" data-cam="r" aria-label="Turn right">&#8635;</button>
      <button class="pb" data-cam="out" aria-label="Zoom out">-</button><button class="pb" data-cam="down" aria-label="Look from lower">v</button><button class="pb" data-cam="in" aria-label="Zoom in">+</button>
      <button class="pb" id="bReset" style="grid-column:span 3;width:auto">Centre</button>
    </div>
    <div id="hud3" hidden></div>
    <canvas id="mini" width="150" height="150" hidden></canvas>
    <div id="pop3"></div>
    <div id="pad3" hidden>
      <div id="joy"><div id="knob"></div></div>
      <div id="pbtns"><button class="pb" data-k="c" id="pC" hidden>Bomb</button><button class="pb" data-k="b" id="pB">Kick</button><button class="pb" data-k="u" aria-label="Jump">^</button><button class="pb act" data-k="a" id="pA">Punch</button></div>
      <button class="pb" id="pExit">Exit</button>
    </div>
    <div class="sheet" id="gamesSheet"><div class="card"><h2>Games</h2><div id="gopts"></div><div class="foot"><button class="pb" data-close>Close</button><button class="pb on" id="gGo">Start!</button></div></div></div>
    <div class="sheet" id="stageSheet"><div class="card"><h2>Pick a stage</h2><div class="stages" id="stageList"></div><div class="foot"><button class="pb" data-close>Close</button></div></div></div>
    <div class="sheet" id="makerSheet"><div class="card">
      <h2>Make a character</h2>
      <div class="mk"><canvas id="mkPrev" width="16" height="31"></canvas>
        <div id="mkRows"><div class="row"><label for="mkName">Name</label><input id="mkName" maxlength="12"></div><div id="mkOpts"></div></div></div>
      <div class="foot"><button class="pb" id="mkRandom">Random</button><button class="pb" id="mkDelete">Delete</button><button class="pb" data-close>Cancel</button><button class="pb on" id="mkSave">Save</button></div>
    </div></div>
  </div>
  <div id="dock">
    <div id="tabs"><button class="pb" data-tab="people">People</button><button class="pb" data-tab="things">Things</button><button class="pb" data-tab="weapons">Weapons</button><button class="pb" data-tab="rides">Rides</button><button class="pb" data-tab="tools">Tools</button><button class="pb" id="bHide">Hide</button></div>
    <div id="growBar" hidden><span>How much?</span><button class="pb" data-g="2">x2</button><button class="pb" data-g="10">x10</button><button class="pb" data-g="100">x100</button><button class="pb on" data-g="1000">x1000</button></div>
    <div id="slots"></div>
  </div>
</div>
<script>
(()=>{
// ============ pixel art ============
const SKINS=["#ffdbb5","#f1c27d","#e0ac69","#c68642","#8d5524","#5c3a21"];
const HAIR_COLS=["#2b1d14","#5a3825","#a0522d","#e8701e","#f4c542","#9e9e9e","#d95b8a","#3b6fd6"];
const CLOTH=["#e84a4a","#f59e2b","#f7d43c","#4cbf56","#2fb0a8","#3b82f6","#6c4ad6","#e86aa8","#ffffff","#3a3f4a","#8b5a2b","#9aa4b0"];
const SHOES=["#3a3f4a","#e84a4a","#3b82f6","#ffffff","#8b5a2b","#f59e2b"];
const HAIRS=["short","spiky","bob","long","pigtails","cap","curly","bald"];
const TOPS=["tee","vest","overalls","dress","checker","stripes","hoodie"];
const BOTTOMS=["pants","shorts","skirt"], SLEEVES=["short","long","none"], SIZES=[0.75,1,1.35];
const NAMES=["Max","Zoe","Leo","Mia","Bolt","Pip","Rex","Luna","Kiko","Taro","Nala","Ziggy","Ana","Jojo","Bea","Migs"];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function hex2rgb(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function dark(h,f=0.78){ const [r,g,b]=hex2rgb(h); return `rgb(${Math.round(r*f)},${Math.round(g*f)},${Math.round(b*f)})`; }
function cv(w,h){ const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; c.x=x; return c; }
function R(c,x,y,w,h,col){ c.x.fillStyle=col; c.x.fillRect(x,y,w,h); }
function P(c,x,y,col){ R(c,x,y,1,1,col); }
function disc(c,cx,cy,r,col){ for(let y=0;y<c.height;y++) for(let x=0;x<c.width;x++) if((x+.5-cx)**2+(y+.5-cy)**2<=r*r) P(c,x,y,col); }

function randomSpec(){ const r=Math.random(); return {name:pick(NAMES),skin:pick(SKINS),hair:pick(HAIRS),hair_col:pick(HAIR_COLS),top:pick(TOPS),top_col:pick(CLOTH),top_col2:pick(CLOTH),sleeves:pick(SLEEVES),bottom:pick(BOTTOMS),bot_col:pick(CLOTH),shoe_col:pick(SHOES),size:r<0.15?0.75:r>0.85?1.35:1}; }
function ninjaSpec(){ return {name:'Ninja',skin:pick(SKINS),hair:'short',hair_col:'#1d1d26',top:'hoodie',top_col:'#1d1d26',top_col2:'#c0392b',sleeves:'long',bottom:'pants',bot_col:'#1d1d26',shoe_col:'#1d1d26',size:1,ninja:true}; }
function dummySpec(){ return {name:"Dummy",skin:"#f7d43c",hair:"bald",hair_col:"#2b1d14",top:"tee",top_col:"#f7d43c",top_col2:"#3a3f4a",sleeves:"none",bottom:"pants",bot_col:"#f7d43c",shoe_col:"#3a3f4a",size:1,dummy:true}; }
const isDress=sp=>sp.top==="dress"||sp.top==="checker";

const PHOTOS={};
function photoImg(src){ if(!PHOTOS[src]){ const im=new Image(); im.onload=()=>{ rags.forEach(r=>{ if(r.spec.photo===src) r.tex=makeTex(r.spec); }); if(typeof buildSlots==='function') buildSlots(); if(document.getElementById('makerSheet').classList.contains('show')&&typeof mkSpec!=='undefined'&&mkSpec&&mkSpec.photo===src) renderMaker(); }; im.src=src; PHOTOS[src]=im; } return PHOTOS[src]; }
function photoHead(sp,face){
  const c=cv(16,16), im=photoImg(sp.photo);
  if(im.complete&&im.naturalWidth) c.x.drawImage(im,0,0,16,16); else disc(c,8,8,7.5,sp.skin);
  if(face==="o"){ c.x.globalCompositeOperation='source-atop'; c.x.fillStyle='rgba(255,60,60,.35)'; c.x.fillRect(0,0,16,16); c.x.globalCompositeOperation='source-over'; }
  if(face==="k"){ const d=c.x.getImageData(0,0,16,16); for(let i=0;i<d.data.length;i+=4){ const g=(d.data[i]+d.data[i+1]+d.data[i+2])/3; d.data[i]=d.data[i+1]=d.data[i+2]=g; } c.x.putImageData(d,0,0);
    [[4,6],[6,6],[5,7],[4,8],[6,8],[9,6],[11,6],[10,7],[9,8],[11,8]].forEach(p=>P(c,p[0],p[1],"#222")); }
  return c;
}
function headImg(sp,face){
  if(sp.photo) return photoHead(sp,face);
  const c=cv(12,14), hc=sp.hair_col, hs=sp.hair, skin=sp.skin;
  if(hs==="long") R(c,1,3,10,11,hc); else if(hs==="bob") R(c,1,3,10,8,hc); else if(hs==="curly") R(c,1,2,10,6,hc);

// ---------- random maze generator ----------
function genMaze(N){ const E=[...Array(N)].map(()=>Array(N).fill(true)), S=[...Array(N)].map(()=>Array(N).fill(true)), vis=[...Array(N)].map(()=>Array(N).fill(false)), st=[[0,0]]; vis[0][0]=true;
  while(st.length){ const [i,j]=st[st.length-1], nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([a,b])=>[i+a,j+b,a,b]).filter(([x,y])=>x>=0&&y>=0&&x<N&&y<N&&!vis[x][y]); if(!nb.length){ st.pop(); continue; }
    const [x,y,a,b]=pick(nb); if(a===1) E[i][j]=false; if(a===-1) E[x][y]=false; if(b===1) S[i][j]=false; if(b===-1) S[x][y]=false; vis[x][y]=true; st.push([x,y]); }
  for(let k=0;k<Math.round(N*N*0.08);k++){ if(Math.random()<0.5){ const i=ri(0,N-2), j=ri(0,N-1); E[i][j]=false; } else { const i=ri(0,N-1), j=ri(0,N-2); S[i][j]=false; } }
  const open=(i,j,d)=>d===0?i<N-1&&!E[i][j]:d===1?i>0&&!E[i-1][j]:d===2?j<N-1&&!S[i][j]:j>0&&!S[i][j-1];
  const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
  const bfs=(a,b)=>{ const key=(i,j)=>i*N+j, prev=new Map([[key(...a),null]]), q=[a]; while(q.length){ const [i,j]=q.shift(); if(i===b[0]&&j===b[1]) break; for(let d=0;d<4;d++) if(open(i,j,d)){ const n=[i+DIRS[d][0],j+DIRS[d][1]]; if(!prev.has(key(...n))){ prev.set(key(...n),[i,j]); q.push(n); } } }
    const path=[]; let cur=b; if(!prev.has(key(...b))) return []; while(cur){ path.unshift(cur); cur=prev.get(key(...cur)); } return path; };
  return {N,E,S,open,bfs,DIRS}; }
